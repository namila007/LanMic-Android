name: lanmic
description: "LAN Mic: use your phone as the TV microphone."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  audio_session: ^0.2.4
  flutter:
    sdk: flutter
  flutter_foreground_task: ^11.0.3
  google_fonts: ^6.2.1
  lanmic_protocol:
    path: ../protocol
  permission_handler: ^13.0.2
  record: ^7.2.0
  shared_preferences: ^2.5.6
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
