name: Bug report
description: Something does not work (cannot connect, no sound, echo, crash)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do **not** post your TV PIN. Your local IP address is not needed either.
  - type: dropdown
    id: app
    attributes:
      label: Which app?
      options: [Phone app, TV app, Both]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: For example 1.1.1
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone model and Android version
      placeholder: Pixel 7, Android 15
  - type: input
    id: tv
    attributes:
      label: TV or streamer model and Android version
      placeholder: Chromecast with Google TV, Android 14
  - type: dropdown
    id: wifi
    attributes:
      label: Wi-Fi
      options: [Same 5 GHz network, Same 2.4 GHz network, Different bands on the same router, Guest or isolated network, Not sure]
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the TV app
        2. ...
  - type: textarea
    id: logs
    attributes:
      label: Connection stats or logs (optional)
      description: The Delay, Network round trip and Lost audio values from the stats card help a lot. Remove your PIN from any logs.
      render: text
