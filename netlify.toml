[build]
  base = "site"
  command = "npm run build"
  publish = "dist"
  # Exit 0 = skip the build. Runs in the base dir (site/), so only site/ changes trigger a deploy.
  # Production always builds: CACHED_COMMIT_REF can point at a preview build of the same commit,
  # which made the diff empty and skipped the production deploy. Previews and branch deploys
  # skip when nothing under site/ changed, and build when there is no previous deploy.
  ignore = "[ \"$CONTEXT\" != production ] && [ -n \"$CACHED_COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../netlify.toml"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.github.com; base-uri 'self'; form-action 'none'; frame-src https://app.netlify.com; frame-ancestors 'none'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
