name: pcm_out
description: Kotlin UDP receiver and native Oboe low-latency output for the LAN Mic TV app.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.3
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: me.namila.app.lanmic.pcm_out
        pluginClass: PcmOutPlugin
